#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Shadows
#################################

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.25;

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# Rounded Corners
#################################

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

#################################
# Fading
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
# Transparency
#################################

inactive-opacity = 0.92;
active-opacity = 1.00;
frame-opacity = 1.00;

#################################
# Blur
#################################

blur:
{
    method = "dual_kawase";
    strength = 5;
}

blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

#################################
# General
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;

#################################
# Window Rules
#################################

opacity-rule = [
    "100:class_g = 'Polybar'",
    "100:class_g = 'Rofi'",
    "90:class_g = 'kitty'"
];
