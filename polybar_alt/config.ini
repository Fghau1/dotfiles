[colors]
background = #F01A2E28
background-alt = #16332B
foreground = #D8F3E3
primary = #4FD1A5
secondary = #7EE8B8
alert = #FF6B6B
yellow = #A8E890
purple = #6FCF97
mint = #3DDC97
disabled = #5C8577
separator-fg = #2C4A3C

[bar/main]
; Straight full-width bar, no floating/rounded pill — flat and sharp
width = 100%
height = 30
offset-x = 0
offset-y = 0
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

; Thin bottom accent line instead of a boxed border — subtle, not blocky
line-size = 2
line-color = ${colors.primary}
border-size = 0

padding-left = 2
padding-right = 2
module-margin = 1

; Single font stack with a fallback size for icons, avoids missing-glyph gaps
font-0 = JetBrainsMono Nerd Font:size=10:weight=medium;2
font-1 = JetBrainsMono Nerd Font:size=13;3

modules-left = i3 xwindow
modules-center = date
modules-right = cpu memory pulseaudio network tray

enable-ipc = true
wm-restack = i3
cursor-click = pointer
cursor-scroll = ns-resize

; Explicit tray sizing/background prevents the common "black square tray icon" bug
tray-position = right
tray-padding = 4
tray-maxsize = 18
tray-background = ${colors.background}
tray-detached = false

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true

; Flat underline instead of a filled pill — clean, no background box
label-focused = %name%
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
; Shortened + trimmed to prevent long titles pushing center modules off-center
label = %title:0:35:...%
label-foreground = ${colors.disabled}

[module/separator]
type = custom/text
content = "│"
content-foreground = ${colors.separator-fg}
content-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label =  %percentage%%
label-foreground = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = 󰍛 %percentage_used%%
label-foreground = ${colors.purple}

[module/network]
type = internal/network
interface-type = wireless
format-connected = <label-connected>
format-connected-padding = 1
label-connected = 󰤨 %essid%
label-connected-foreground = ${colors.mint}

format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = 󰤭 Offline
label-disconnected-foreground = ${colors.alert}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-padding = 1
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.primary}

format-muted = <label-muted>
format-muted-padding = 1
label-muted = 󰝟 Mute
label-muted-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = 󰃭 %date%  %time%
format = <label>
format-padding = 2
label-foreground = ${colors.yellow}

[module/tray]
type = internal/tray
format-margin = 6pt
tray-spacing = 8pt