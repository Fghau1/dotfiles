[colors]
background = #CC282828
foreground = #EBDBB2
primary = #83A598
secondary = #B8BB26
alert = #FB4934
disabled = #928374


[bar/main]
width = 100%
height = 28
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:size=10;2
modules-left = i3 xwindow
modules-center = date
modules-right = cpu memory pulseaudio network tray
enable-ipc = true
wm-restack = i3
cursor-click = pointer
cursor-scroll = ns-resize


[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = #282828
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2


[module/xwindow]
type = internal/xwindow
label = %title:0:45:...%


[module/cpu]
type = internal/cpu
interval = 2
format = CPU <label>
label = %percentage%%


[module/memory]
type = internal/memory
interval = 2
format = RAM <label>
label = %percentage_used%%


[module/network]
type = internal/network
interface-type = wireless
format-connected = %{F#83A598}󰤨%{F-} <label-connected>
label-connected = %essid%
format-disconnected = 󰤭 Offline


[module/pulseaudio]
type = internal/pulseaudio
format-volume = 󰕾 <label-volume>
label-volume = %percentage%%
format-muted = 󰝟 Mute


[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%


[module/tray]
type = internal/tray
format-margin = 4pt
tray-spacing = 6pt
